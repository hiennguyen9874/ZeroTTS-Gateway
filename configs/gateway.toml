# OmniVoice gateway config. Env overrides:
#   OMNIVOICE_GATEWAY_UPSTREAM_URL  upstream base URL
#   OMNIVOICE_GATEWAY_API_KEY       enables Bearer auth when set
#   OMNIVOICE_GATEWAY_HOST          listen address (the Docker image sets 0.0.0.0)
upstream_url = "http://127.0.0.1:8080"
host = "127.0.0.1"
port = 8000
# Absolute limit per request: waiting for the first byte plus streaming the whole body.
deadline_s = 300
# Limit on connecting to the upstream only; past it callers get 502 upstream_unavailable and
# /ready returns 503 instead of waiting out deadline_s. Not a read timeout.
connect_timeout_s = 3
max_input_chars = 5000
# Pronunciation lexicon (CSV: word,replacement,note), relative to this file; read at startup.
lexicon_path = "lexicon.csv"

# Per-model defaults; model ids not listed here are still forwarded.
#
# short_text_speed (off unless set, ADR 0004): `speed` the gateway sends when the caller sends
# neither `speed` nor `options.duration_sec` and the engine text has at most
# short_text_max_syllables (default 12) syllables. audio.cpp gives short text too little time and
# some voices then drop its first phrase; 0.7 brought the short cases of issue #18 to full recall.
[models.g-omnivoice]
language = "vi"
short_text_speed = 0.7

[models.g-omnivoice-stream]
language = "vi"
short_text_speed = 0.7

[models.omnivoice-vietnamese]
language = "vi"

[models.omnivoice]
normalize = false
