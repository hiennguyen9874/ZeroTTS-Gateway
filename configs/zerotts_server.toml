# zerotts_server config (the ZeroTTS upstream, ADR 0005). Env overrides:
#   ZEROTTS_SERVER_CONFIG     path to this file, when --config is not given
#   ZEROTTS_SERVER_MODEL_DIR  model_dir
#   ZEROTTS_SERVER_HOST       listen address
#   ZEROTTS_SERVER_PORT       listen port
host = "127.0.0.1"
port = 8080
# Local weights downloaded with `hf download --local-dir` (not the HF cache); relative to this file.
model_dir = "../models/ZeroTTS"
# Voice packs (<name>/voice.npz + meta.json); default <model_dir>/voices. Drop a pack in, restart.
# voices_dir = "../models/ZeroTTS/voices"
# Workers, each holding its own model instance (memory grows with workers) and running one
# request at a time.
workers = 1
# onnxruntime intra-op threads per worker; workers × threads should not exceed the CPU cores.
threads = 8
# Seconds a request waits for a free worker before it gets 503 server_busy; 0 means no wait.
busy_timeout = 5.0

# Model ids served; callers cannot change sampling, only `seed`. `mode` is "offline" (default:
# wav/pcm/json) or "streaming" (only stream_format sse/audio), as audio.cpp's model entries.
[models.zerotts]
# Used when the request has no `voice`; must exist in the voice directory.
default_voice = "maichi"

[models.zerotts.sampling]
cfg_scale = 1.0
text_temperature = 1.0
text_topk = 50
audio_temperature = 0.8
audio_topk = 25
audio_topp = 0.95
audio_repetition_penalty = 1.2

[models.zerotts-stream]
mode = "streaming"
default_voice = "maichi"

[models.zerotts-stream.sampling]
cfg_scale = 1.0
text_temperature = 1.0
text_topk = 50
audio_temperature = 0.8
audio_topk = 25
audio_topp = 0.95
audio_repetition_penalty = 1.2
