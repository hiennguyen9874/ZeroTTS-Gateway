# Gateway only; points at an upstream running elsewhere. Variables come from .env (see .env.example).
# zerotts_server in Docker as well: compose.zerotts.yaml (+ compose.zerotts-stack.yaml on the same
# host).
services:
  gateway:
    build: .
    image: zerotts-gateway
    restart: unless-stopped
    environment:
      ZEROTTS_GATEWAY_UPSTREAM_URL: ${ZEROTTS_GATEWAY_UPSTREAM_URL:-http://host.docker.internal:8080}
      ZEROTTS_GATEWAY_API_KEY: ${ZEROTTS_GATEWAY_API_KEY:-}
    # Lets host.docker.internal reach the Docker host on Linux.
    extra_hosts:
      - host.docker.internal:host-gateway
    # Config and lexicon read-only; edit them on the host and restart, no rebuild.
    volumes:
      - ./configs:/config:ro
    ports:
      - ${GATEWAY_PORT:-8000}:8000
