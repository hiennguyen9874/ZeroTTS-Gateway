# Gateway only; points at an audio.cpp running elsewhere. Variables come from .env (see .env.example).
# audio.cpp in Docker as well: compose.audiocpp.yaml (+ compose.stack.yaml on the same host).
services:
  gateway:
    build: .
    image: omnivoice-gateway
    restart: unless-stopped
    environment:
      OMNIVOICE_GATEWAY_UPSTREAM_URL: ${OMNIVOICE_GATEWAY_UPSTREAM_URL:-http://host.docker.internal:8080}
      OMNIVOICE_GATEWAY_API_KEY: ${OMNIVOICE_GATEWAY_API_KEY:-}
    # Lets host.docker.internal reach the Docker host on Linux.
    extra_hosts:
      - host.docker.internal:host-gateway
    # Config and lexicon read-only; edit them on the host and restart, no rebuild.
    volumes:
      - ./configs:/config:ro
    ports:
      - ${GATEWAY_PORT:-8000}:8000
