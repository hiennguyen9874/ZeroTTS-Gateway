# CPU-only overlay; append after compose.audiocpp.yaml (and compose.stack.yaml).
# Requires Docker Compose >= 2.24.0 for !reset.
services:
  audiocpp:
    build:
      args:
        BUILD_IMAGE: ubuntu:24.04
        RUNTIME_IMAGE: ubuntu:24.04
        ENGINE_ENABLE_CUDA: "OFF"
        BUILD_JOBS: ${AUDIOCPP_BUILD_JOBS:-4}
    image: ${AUDIOCPP_CPU_IMAGE:-omnivoice-audiocpp:cpu}
    # Remove the NVIDIA reservation inherited from compose.audiocpp.yaml.
    deploy:
      resources:
        reservations:
          devices: !reset []
    command: ["--config", "/srv/configs/server.json", "--host", "0.0.0.0", "--port", "8080", "--backend", "cpu"]
