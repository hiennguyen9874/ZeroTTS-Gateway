# Overlay: gateway + audio.cpp on one host, over the compose network. Use only together with
# compose.yaml and compose.audiocpp.yaml:
#   COMPOSE_FILE=compose.yaml:compose.audiocpp.yaml:compose.stack.yaml   (in .env)
services:
  gateway:
    environment:
      # Overrides ZEROTTS_GATEWAY_UPSTREAM_URL from .env.
      ZEROTTS_GATEWAY_UPSTREAM_URL: http://audiocpp:8080
    depends_on:
      audiocpp:
        condition: service_healthy
