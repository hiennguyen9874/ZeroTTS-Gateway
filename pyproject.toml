[project]
name = "zerotts-gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Xuan Hien", email = "hiennguyen9874@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "huggingface-hub>=2.2.0",
    "sea-g2p==0.10.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# zerotts_server (the upstream, ADR 0005); the gateway image does not need it.
server = [
    "numpy>=2.5.4",
    "onnxruntime==1.31.1",
    "soundfile>=0.12.1",
    "tokenizers>=0.20.0",
]
# The torch-cuda runtime (ADR 0007). CUDA 12.6 wheels run on driver >= 525 (dev machine: 535).
server-cuda = [
    "zerotts-gateway[server]",
    "safetensors==0.8.0",
    "torch==2.14.1",
    "transformers==5.22.1",
]

[project.scripts]
zerotts-gateway = "zerotts_gateway:main"
zerotts-server = "zerotts_server:main"

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", extra = "server-cuda" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["zerotts_gateway", "zerotts_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not real_model and not cuda"'
markers = [
    "real_model: runs the real ZeroTTS weights from models/ (skipped when absent)",
    "cuda: runs the torch-cuda runtime (skipped without a GPU, torch or models/ZeroTTS-torch)",
]

[dependency-groups]
quantize = [
    "onnx==1.20.1",
    "onnxruntime==1.31.1",
]
torch-weights = [
    "gguf==0.19.0",
    "numpy>=2.5.4",
    "onnx==1.20.1",
    "safetensors==0.8.0",
]
asr = [
    "numpy>=2.5.4",
    "python-multipart>=0.0.32",
    "sherpa-onnx>=1.12",
    "sherpa-onnx-core>=1.12",
]
dev = [
    "zerotts-gateway[server]",
    "pytest>=9.1.1",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# model/moss is third-party code kept verbatim (model/moss/VENDORED.md).
extend-exclude = ["references", "models", "voices_candidates", ".pi", "src/zerotts_server/model/moss"]

[tool.ruff.format]
# Scope is Python code; leave code blocks in docs as written.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
